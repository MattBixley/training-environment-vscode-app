# GitHub over port 443. Some networks block outbound SSH on port 22; GitHub
# serves the same SSH endpoint on ssh.github.com:443, so `git@github.com:...`
# remotes and `ssh -T git@github.com` work either way. HostKeyAlias keeps the
# host key check against the github.com keys pinned in /etc/ssh/ssh_known_hosts.
Host github.com
    HostName ssh.github.com
    Port 443
    User git
    HostKeyAlias github.com
