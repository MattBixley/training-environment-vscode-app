---
cluster: "my-k8s-cluster"

form:
  - cpu
  - memory
  - vram_l4
  - vram_a100_40
  - vram_a100
  - vram_h100
  - vram_pro_6000
  - wall_time

attributes:
  # GPU work is CPU work here, and the emulated utilisation figure is derived
  # from how much of the CPU allocation a job actually uses. Too few cores and
  # every job looks busy at trivial load; these defaults give PyTorch enough to
  # work with and make the utilisation reading mean something.
  cpu: 4
  memory: 8

  # One control per card in Mahuika's fleet. The session's node presents every
  # card you leave switched on, so `--gpus-per-node a100:1` and
  # `--gpus-per-node l4:1` are different requests that get different devices -
  # which is what makes "choose the right card" something a learner can do here
  # rather than only read about. Asking for a card you switched off is refused
  # by sbatch, the same way the cluster refuses a card the partition lacks.
  #
  # **No physical GPU is involved.** All computation runs on the CPU; what each
  # card changes is the model name, memory size, clocks and power envelope that
  # nvidia-smi, nvtop, seff and PyTorch report.
  #
  # The default of 200 MB per card is deliberate. A small card is the practical
  # way to teach memory pressure: a learner hits a genuine out-of-memory error
  # with a tensor that costs the session almost nothing, so batch-sizing and
  # OOM-recovery exercises work without the session needing tens of gigabytes of
  # real RAM to fill. Every exercise fits, with room to spare. "Full size"
  # reports the real board's figure instead - choose it when the reported size
  # is itself the point.
  #
  # Emulated VRAM is accounted rather than reserved, so the cards cost nothing
  # until a tensor is actually made. A filled card does cost that much host
  # memory though, which is why the figure is small: the whole fleet held at
  # once is a gigabyte of the session's 8 GB rather than five.
  # The options below are repeated for each card rather than shared through a
  # YAML anchor. Do not "tidy" that up: Open OnDemand's dashboard parses this
  # file with `YAML.safe_load(contents)` and no `aliases: true`, so an anchor
  # raises Psych::AliasesNotEnabled and the app silently does not appear at all.
  # tests/test_app_config.py fails if one is reintroduced.
  vram_l4:
    widget: select
    label: "NVIDIA L4 - GPU memory"
    help: |
      The 24&nbsp;GB L4, requested as `--gpus-per-node l4:1`. This is the card
      the workshop exercises use, so switching it off will break them.
    options:
      - ["200 MiB (default)", "200MiB"]
      - ["100 MiB", "100MiB"]
      - ["512 MiB", "512MiB"]
      - ["1 GiB", "1GiB"]
      - ["2 GiB", "2GiB"]
      - ["4 GiB", "4GiB"]
      - ["Full size (the real board)", "full"]
      - ["Not on this node", "off"]
    value: "200MiB"

  vram_a100_40:
    widget: select
    label: "NVIDIA A100 40 GB - GPU memory"
    help: |
      The 40&nbsp;GB A100, requested as `--gpus-per-node a100_40:1`. The Slurm
      name is provisional until these nodes are in service.
    options:
      - ["200 MiB (default)", "200MiB"]
      - ["100 MiB", "100MiB"]
      - ["512 MiB", "512MiB"]
      - ["1 GiB", "1GiB"]
      - ["2 GiB", "2GiB"]
      - ["4 GiB", "4GiB"]
      - ["Full size (the real board)", "full"]
      - ["Not on this node", "off"]
    value: "200MiB"

  vram_a100:
    widget: select
    label: "NVIDIA A100 80 GB - GPU memory"
    help: |
      The 80&nbsp;GB A100, requested as `--gpus-per-node a100:1`. The only card
      in the fleet built for double precision.
    options:
      - ["200 MiB (default)", "200MiB"]
      - ["100 MiB", "100MiB"]
      - ["512 MiB", "512MiB"]
      - ["1 GiB", "1GiB"]
      - ["2 GiB", "2GiB"]
      - ["4 GiB", "4GiB"]
      - ["Full size (the real board)", "full"]
      - ["Not on this node", "off"]
    value: "200MiB"

  vram_h100:
    widget: select
    label: "NVIDIA H100 NVL - GPU memory"
    help: |
      The 94&nbsp;GB H100 NVL, requested as `--gpus-per-node h100:1`.
    options:
      - ["200 MiB (default)", "200MiB"]
      - ["100 MiB", "100MiB"]
      - ["512 MiB", "512MiB"]
      - ["1 GiB", "1GiB"]
      - ["2 GiB", "2GiB"]
      - ["4 GiB", "4GiB"]
      - ["Full size (the real board)", "full"]
      - ["Not on this node", "off"]
    value: "200MiB"

  vram_pro_6000:
    widget: select
    label: "NVIDIA RTX PRO 6000 - GPU memory"
    help: |
      The 96&nbsp;GB RTX PRO 6000 Blackwell, requested as
      `--gpus-per-node pro_6000:1`.
    options:
      - ["200 MiB (default)", "200MiB"]
      - ["100 MiB", "100MiB"]
      - ["512 MiB", "512MiB"]
      - ["1 GiB", "1GiB"]
      - ["2 GiB", "2GiB"]
      - ["4 GiB", "4GiB"]
      - ["Full size (the real board)", "full"]
      - ["Not on this node", "off"]
    value: "200MiB"

  wall_time:
    widget: number_field
    label: "Hours"
    min: 1
    max: 12
    value: 8
